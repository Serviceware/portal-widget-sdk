<div
    [id]="widget().usedVersion.name + '-' + widget().id"
    class="widget-container"
    [class.panel-hovered]="isHoveredFromPanel()"
>
    <div class="widget-wrapper" [ngClass]="checkClassWrapper()">
        <ng-template #widgetSkeleton>
            <ssp-portal-widget-skeleton [skeleton]="skeleton"></ssp-portal-widget-skeleton>
        </ng-template>
        <ax-lazy-element
            [hidden]="(!settingsMode() && (isOnDashboard | async) === false) || skeletonIsVisible"
            *axLazyElementDynamic="
                widget().usedVersion.name;
                url: sourceUrl;
                module: false;
                loadingTemplate: widgetSkeleton;
                errorTemplate: widgetSkeleton
            "
            [authToken]="authToken()"
            [isAdminMode]="isAdminMode()"
            [availableLanguages]="availableLanguages()"
            [apiUrl]="apiUrl"
            [language]="localeService.getSelectedLocale()"
            [targetLanguage]="localeService.getSelectedLocale()"
            [settingsLanguage]="localeService.getSelectedLocale()"
            [showSettingsButton]="isAdminMode() && !(editMode$ | async).active && !settingsMode()"
            [openSettingsEvent]="isAdminMode()"
            [portalEditionMode]="isAdminMode() && (editMode$ | async).active"
            [portalScreenLayout]="screenLayout()"
            [settingsMode]="settingsMode()"
            [configuration]="stableConfiguration()"
            (configurationSaved)="saveConfiguration($event.detail)"
            (configurationCanceled)="cancelConfiguration()"
        ></ax-lazy-element>
        @if (skeletonIsVisible) {
            <ssp-portal-widget-skeleton [skeleton]="skeleton"></ssp-portal-widget-skeleton>
        }
    </div>
</div>
