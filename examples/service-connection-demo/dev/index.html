<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Portal harness: service-connection-demo</title>
        <style>
            @layer codeblue-legacy, codeblue3, portal-base, primeng, portal-overrides, widgets, app-overrides;

            @layer portal-base {
                * {
                    box-sizing: border-box;
                }
                body {
                    margin: 0;
                    font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
                    color: #1f2933;
                    background: #eef2f6;
                }
                header {
                    display: flex;
                    flex-wrap: wrap;
                    align-items: center;
                    gap: 10px 16px;
                    padding: 10px 16px;
                    background: #003f72;
                    color: #fff;
                }
                header h1 {
                    margin: 0 8px 0 0;
                    font-size: 15px;
                }
                header button {
                    padding: 3px 8px;
                    border: 1px solid rgba(255, 255, 255, 0.5);
                    border-radius: 4px;
                    background: transparent;
                    color: #fff;
                    font: inherit;
                    font-size: 12px;
                    cursor: pointer;
                }
                main {
                    display: grid;
                    grid-template-columns: 480px minmax(0, 1fr);
                    gap: 16px;
                    padding: 16px;
                }
                .tile {
                    height: 460px;
                    overflow: hidden;
                    border: 1px solid #cfd8e3;
                    border-radius: 12px;
                    background: #fff;
                }
                aside h2 {
                    margin: 0 0 8px;
                    font-size: 13px;
                    text-transform: uppercase;
                    color: #6b7a88;
                }
                #log {
                    height: calc(100vh - 140px);
                    margin: 0;
                    padding: 0;
                    overflow: auto;
                    list-style: none;
                    font: 12px/1.45 ui-monospace, Consolas, monospace;
                }
                #log li {
                    padding: 6px 8px;
                    border-bottom: 1px solid #dfe6ee;
                    white-space: pre-wrap;
                    overflow-wrap: anywhere;
                }
                #log li b {
                    color: #0082bb;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Portal harness</h1>
            <button id="settings" type="button">toggle settings mode</button>
            <button id="anonymous" type="button">toggle anonymous</button>
            <button id="unlink" type="button">toggle linked connection</button>
        </header>
        <main>
            <div class="tile" id="tile"></div>
            <aside>
                <h2>What leaves the page, and what the widget dispatches</h2>
                <ul id="log"></ul>
            </aside>
        </main>
        <script type="module" src="./harness.js"></script>
    </body>
</html>
